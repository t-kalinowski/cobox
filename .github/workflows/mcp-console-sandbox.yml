name: Diagnose macOS proxy contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Reproduce managed proxy contract on macOS 14
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Record the host and port range
        run: |
          sw_vers
          sysctl net.inet.ip.portrange
      - name: Compare repeated sockets within an immutable sandbox profile
        run: python3 mcp-console-sandbox/tests/seatbelt_socket_lifetime_diagnostic.py
      - name: Collect matching sandbox denials
        if: failure()
        run: |
          sudo /usr/bin/log show --last 15m --style compact --info --debug \
            --predicate 'eventMessage CONTAINS "mcp-console-sandbox" OR (eventMessage CONTAINS[c] "python" AND eventMessage CONTAINS "network-outbound")'
