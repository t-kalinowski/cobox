name: Diagnose macOS proxy policy application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-comparison:
    name: Compare native and upstream proxy policy on macOS 14
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
        shell: bash
    env:
      SANDBOX_PROXY_TRIALS: "5"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Record host and endpoint allocation policy
        run: |
          echo "SANDBOX_DIAGNOSTIC_DIR=$RUNNER_TEMP/macos-proxy-policy" >> "$GITHUB_ENV"
          sw_vers
          sysctl net.inet.ip.portrange
          git rev-parse HEAD
      - name: Compare public proxy execution paths
        run: |
          mkdir -p "$SANDBOX_DIAGNOSTIC_DIR"
          cargo test --locked -p mcp-console-sandbox --test macos_proxy_ownership -- --nocapture \
            2>&1 | tee "$SANDBOX_DIAGNOSTIC_DIR/run.log"
      - name: Capture matching sandbox denials
        if: failure()
        run: |
          sudo /usr/bin/log show --last 15m --style compact --info --debug \
            --predicate 'eventMessage CONTAINS "mcp-console-sandbox" OR process == "sandboxd"' \
            | tee "$SANDBOX_DIAGNOSTIC_DIR/sandbox.log"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: macos14-proxy-policy
          path: ${{ runner.temp }}/macos-proxy-policy
          retention-days: 7
