name: Diagnose macOS proxy contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Reproduce managed proxy contract on macOS 14
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: codex-rs
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          components: rustfmt
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: nextest@0.9.103,just@1.51.0
      - name: Record the host and port range
        run: |
          sw_vers
          sysctl net.inet.ip.portrange
      - name: Isolate native Seatbelt endpoint matching
        run: python3 mcp-console-sandbox/tests/seatbelt_proxy_diagnostic.py
      - name: Reproduce the public proxy contract
        if: always()
        run: |
          set -eu
          for iteration in $(seq 1 100); do
            printf 'Reproduction iteration %s\n' "$iteration"
            just test --locked -p mcp-console-sandbox --retries 0 \
              --test bootstrap_contract \
              unrestricted_and_external_managed_proxy_preserve_routing_and_allowlist
          done
      - name: Collect matching sandbox denials
        if: failure()
        run: |
          sudo /usr/bin/log show --last 15m --style compact --info --debug \
            --predicate 'eventMessage CONTAINS "mcp-console-sandbox"'
